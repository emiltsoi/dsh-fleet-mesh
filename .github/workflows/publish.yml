name: Publish

# Fires on a published GitHub release, so the version that ships is the version that was
# tagged and reviewed. workflow_dispatch is there for a deliberate re-run.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance: ties the published tarball to this commit and run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >= 11.5.1. Do not pin: just be current.
      - name: Ensure a modern npm
        run: npm install -g npm@latest && npm --version

      # Never publish something the tests have not seen. The same three suites CI runs.
      - name: Verify before publishing
        run: |
          node test/mesh.test.mjs
          node test/outbound.test.mjs
          node test/smoke.mjs

      # TRUSTED PUBLISHING — deliberately NO token.
      #
      # npm exchanges this workflow's OIDC identity for a short-lived credential, which is
      # why `id-token: write` is granted above and why there is no NPM_TOKEN secret to
      # rotate or leak. Classic npm tokens were retired (creation disabled 2025-11,
      # existing ones revoked 2025-12), so a long-lived publish token is not the modern
      # path anyway.
      #
      # PREREQUISITE, and it lives on npmjs.com rather than in this repo: the package must
      # already exist, with this repository and THIS workflow filename registered as a
      # trusted publisher. See README → Publishing.
      - name: Publish to npm
        run: npm publish --provenance --access public
